<!doctype html>
<meta charset="utf-8">
<style>html,body{margin:0;background:#000;height:100%}iframe{display:block;border:0}</style>
<iframe id="f"></iframe>
<script>
// Screenshot driver for the throwaway demo instance: signs in, presets what the browser remembers,
// opens the app in a frame and clicks through steps.
const q = new URLSearchParams(location.search);
localStorage.setItem("plainboard.design", q.get("design") || "classic");
localStorage.setItem("plainboard.appearance", q.get("theme") === "light" ? "light" : "dark");
localStorage.setItem("plainboard.view", JSON.stringify(q.get("view") || "board"));
localStorage.setItem("plainboard.chatOpen", JSON.stringify(q.get("panel") !== "0"));
localStorage.setItem("plainboard.chatDetails", JSON.stringify(q.get("details") === "1"));
localStorage.setItem("plainboard.panelWidth", q.get("pw") || "400");
localStorage.setItem("plainboard.chatAgent.1", q.get("agent") || "1");
localStorage.setItem("plainboard.project", "1");
localStorage.removeItem("plainboard.boardShut");
const f = document.getElementById("f");
f.style.width = q.get("w") ? q.get("w") + "px" : "100vw";
f.style.height = q.get("h") ? q.get("h") + "px" : "100vh";
const steps = JSON.parse(q.get("steps") || "[]");
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
f.onload = async () => {
  // The demo instance has no runner: its warning is not part of the picture.
  const st = f.contentDocument.createElement("style");
  st.textContent = '[title="Runner not reachable"]{display:none!important}';
  f.contentDocument.head.appendChild(st);
  await sleep(2500);
  for (const s of steps) {
    const d = f.contentDocument;
    let el = null;
    if (s.c) el = d.querySelectorAll(s.c)[s.i || 0];
    else {
      const all = [...d.querySelectorAll("button,article,a,[role=menuitem],[role=option],li,label")];
      const hits = all.filter((e) => e.textContent.trim() === s.t);
      el = (hits.length ? hits : all.filter((e) => e.textContent.includes(s.t)).sort((a, b) => a.textContent.length - b.textContent.length))[s.i || 0];
    }
    if (el) el.click();
    else document.title = "missing " + JSON.stringify(s);
    await sleep(s.w || 900);
  }
};
fetch("/api/auth/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ username: "demo", password: "demo-demo-demo" }) }).then(() => {
  f.src = "/";
});
</script>
