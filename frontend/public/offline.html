<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>PlainBoard</title>
    <style>
      /* Same tokens as the app (src/index.css); this page must work without any other file. */
      :root {
        --bg: #161614;
        --fg: #ecebe3;
        --fg-2: #bdbbb2;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f1f0ea;
          --fg: #191917;
          --fg-2: #4a4944;
        }
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 16px;
        box-sizing: border-box;
        font: 16px/1.4 "Arial Narrow", system-ui, sans-serif;
        text-align: center;
        background: var(--bg);
        color: var(--fg);
      }
      h1 { margin: 0; font-size: inherit; font-weight: 800; }
      p { margin: 0; color: var(--fg-2); }
      button {
        margin-top: 10px;
        height: 40px;
        padding: 0 16px;
        border: 0;
        border-radius: 2px;
        background: var(--fg);
        color: var(--bg);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <h1>PlainBoard is not reachable</h1>
    <p>Check your connection, or whether the server is running.</p>
    <button onclick="location.href = '/'">Try again</button>
  </body>
</html>
